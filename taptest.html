<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>点按测速</title>
<style>
 body{margin:0;background:#111;color:#eee;font-family:-apple-system;display:flex;flex-direction:column;height:100vh}
 #pad{flex:1;display:flex;align-items:center;justify-content:center;font-size:28px;user-select:none;-webkit-user-select:none;background:#1a1a1a;transition:background .05s}
 #pad.on{background:#2d5016}
 #info{padding:16px;font-size:16px;line-height:1.7;white-space:pre-line}
</style></head><body>
<div id="pad">在这里狂点 10 秒</div>
<div id="info">点第一下开始计时</div>
<script>
let times=[], running=false, t0=0;
const pad=document.getElementById('pad'), info=document.getElementById('info');
pad.addEventListener('touchstart', e=>{ e.preventDefault(); hit(); }, {passive:false});
pad.addEventListener('mousedown', e=>{ e.preventDefault(); hit(); });
function hit(){
  const now=performance.now();
  if(!running){ running=true; t0=now; times=[]; pad.textContent='点！'; }
  times.push(now);
  pad.classList.add('on'); setTimeout(()=>pad.classList.remove('on'),40);
  const el=now-t0;
  if(el>=10000){ running=false; done(); return; }
  info.textContent = `已点 ${times.length} 下\n已用 ${(el/1000).toFixed(1)} 秒\n当前 ${Math.round(el/Math.max(times.length-1,1))} ms/下`;
}
function done(){
  const n=times.length;
  const d=[]; for(let i=1;i<n;i++) d.push(times[i]-times[i-1]);
  const total=(times[n-1]-times[0])/1000;
  const avg=total*1000/(n-1);
  const mn=Math.min(...d), mx=Math.max(...d);
  info.textContent = `=== 结果 ===\n共 ${n} 下 / ${total.toFixed(1)} 秒\n平均 ${Math.round(avg)} ms/下\n最快 ${Math.round(mn)} ms\n最慢 ${Math.round(mx)} ms\n\n把这段话截图发我`;
  fetch('/result',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({n, total:+total.toFixed(2), avg:Math.round(avg), min:Math.round(mn), max:Math.round(mx)})}).catch(()=>{});
  pad.textContent='再来一次'; pad.onclick=()=>location.reload();
}
</script></body></html>
